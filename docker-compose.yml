services:
  db:
    image: mariadb:10.11
    container_name: eventhub-db
    restart: unless-stopped
    environment:
      TZ: Europe/Zagreb                                   # NOW() u lokalnom vremenu
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      EVENTHUB_APP_PASSWORD: ${EVENTHUB_APP_PASSWORD}       # koristi 05_users.sh
      EVENTHUB_REPORT_PASSWORD: ${EVENTHUB_REPORT_PASSWORD} # koristi 05_users.sh
      # MARIADB_USER / MARIADB_DATABASE se namjerno NE koriste: taj korisnik bi
      # dobio ALL PRIVILEGES na bazu, a aplikacija smije samo pozivati procedure.
    command:
      - --event-scheduler=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql                          # trajna pohrana
      - ./init:/docker-entrypoint-initdb.d:ro           # izvrsava se samo na praznom volumenu
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
